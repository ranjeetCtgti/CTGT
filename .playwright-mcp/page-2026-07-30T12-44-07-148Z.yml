                    - text: "We’re hiring! Ocean Pacific Marine Store & Boatyard is seeking an Accountant to join our team in Campbell River. We’re looking for an experienced accounting professional who can support a range of finance and accounting responsibilities, including: - Financial reporting and analysis - General ledger reconciliations - Month-end and year-end close - Project/job costing - Accounts payable and receivable - Revenue tracking and forecasting - GST/PST filings and remittances Qualifications: - 5+ years of progressive accounting experience - Diploma or degree in Accounting, Finance, or a related field - Strong understanding of full-cycle accounting and financial reporting - Project accounting or job costing experience is an asset - SAP Business One experience is an asset 📍 Campbell River, BC 💵 $33–$38/hour depending on experience 🕒 In-person position ✅ Extended health, vision care, life insurance, and EAP benefits If you’re interested, or know someone who may be a great fit, please apply through Indeed or share this opportunity with your network."
