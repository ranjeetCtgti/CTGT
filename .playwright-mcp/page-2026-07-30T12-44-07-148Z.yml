                  - paragraph [ref=f20e188]:
                    - text: "Today is a BIG day for the Ocean Pacific Marine team. We're incredibly excited to share that Ocean Pacific Marine has been awarded a $74.7 million contract to design and build three Next Generation Police Coastal Patrol Vessels for the RCMP. For us, this is about so much more than building boats. It's about creating skilled jobs, investing in our people, growing our local economy, and showcasing the incredible talent that exists right here in BC. We're also proud to be delivering this project alongside two outstanding partners:"
                    - link [ref=f20e189] [cursor=pointer]:
                      - /url: https://uk.linkedin.com/company/camarc-design?trk=organization_guest_main-feed-card-text
                      - text: Camarc Design
                    - text: ", whose world-class patrol vessel expertise will help bring these vessels to life, and"
                    - link [ref=f20e190] [cursor=pointer]:
                      - /url: https://ca.linkedin.com/company/bracewell-marine-group?trk=organization_guest_main-feed-card-text
                      - text: Bracewell Marine Group
                    - text: ", whose fabrication expertise will play a key role in their successful delivery. We're looking forward to what we'll accomplish together. This milestone belongs to every employee, customer, partner, and supporter who has been part of our journey over the past 41 years. Thank you for believing in us. Now... it's time to get building. 💪 Read the full announcement below."
