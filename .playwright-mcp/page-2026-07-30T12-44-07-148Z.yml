          - heading [level=2] [ref=f20e67]: About us
          - generic [ref=f20e68]:
            - paragraph [ref=f20e69]: Ocean Pacific Marine Supply & Boatyard Ltd. is located on Northern Vancouver Island in the City of Campbell River at the Discovery Harbour Marina. The boatyard has been in operation since 1985 having moved to its current location in 2007. The boatyard is located adjacent to the Marine Store and provides 5982 sq meters of hard surface which is serviced by a 150 ton Marine Travelift. Additionally, four vessel enclosures are available and serviceable by the Marine Travelift. Ocean Pacific services commercial vessels which require outfitting and installation of standard equipment; upgrade and modification to equipment and systems; periodic and scheduled maintenance; structural modification and repair. The company can refer to considerable experience in the repair of all types of hulls including wood, fiberglass, aluminium and steel. Ocean Pacific prides itself on its highly trained staff including numerous ABYC certified technicians. The company is registered to ISO 9001 quality management system as well as certified by the Canadian Welding Bureau.
