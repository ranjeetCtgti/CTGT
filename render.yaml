services:
  - type: cron
    name: ctgt-pipeline
    runtime: python
    plan: starter
    region: oregon
    schedule: "0 2 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python render_cron.py pipeline"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ctgt-postgres
          property: connectionString
      - key: SCRAPEDO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PIPELINE_PHASE
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: LLM_REQUESTS_PER_MINUTE
        value: "25"
      - key: MAX_RETRIES
        value: "2"
      - key: BATCH_SIZE
        value: "10"
      - key: ENRICHMENT_ENABLED
        value: "false"
      - key: LEAD_ENRICHMENT_ENABLED
        value: "false"
      - key: PIPELINE_ARGS
        value: "--max-queries 2"

  - type: cron
    name: ctgt-lead-enrichment
    runtime: python
    plan: starter
    region: oregon
    schedule: "30 2 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python render_cron.py enrichment"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ctgt-postgres
          property: connectionString
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LEAD_ENRICHMENT_ENABLED
        value: "true"
      - key: ENRICHMENT_ENABLED
        value: "true"
      - key: ENRICHMENT_PROVIDER
        value: serper
      - key: ENRICHMENT_TIMEOUT_SECONDS
        value: "15"
      - key: LEAD_ENRICHMENT_TIMEOUT_SECONDS
        value: "10"
      - key: LEAD_ENRICHMENT_FRESHNESS_DAYS
        value: "7"
      - key: ENRICHMENT_ARGS
        value: ""

databases:
  - name: ctgt-postgres
    plan: basic-256mb
