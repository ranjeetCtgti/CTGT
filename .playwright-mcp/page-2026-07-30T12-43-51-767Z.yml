                    - text: We are proud to announce that Maritime Launch Services has signed a 10-year agreement with
                    - link [ref=f13e541] [cursor=pointer]:
                      - /url: https://de.linkedin.com/company/isaraerospace?trk=organization_guest_main-feed-card-text
                      - text: Isar Aerospace
                    - text: to establish a dedicated launch complex for the Spectrum launch vehicle at Spaceport Nova Scotia. The agreement was signed today in Ankara, Türkiye, during the NATO Summit Defence Industry Forum by Stephen Matier, President and CEO of Maritime Launch Services, and Daniel Metzler, Chief Executive Officer of Isar Aerospace. Through this partnership, Isar Aerospace will establish its North American launch operations at Spaceport Nova Scotia, with construction beginning this year and first orbital launches targeted for 2028. As Canada’s dual-use orbital spaceport, Spaceport Nova Scotia is being developed as a multi-user launch facility supporting commercial, civil and defence missions while strengthening sovereign access to space for Canada and our allies.
