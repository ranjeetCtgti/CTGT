                      - text: Jeremy Hansen
                    - text: has proudly served Canada as a Royal Canadian Air Force fighter pilot, military leader, astronaut, and ambassador for science and exploration. Throughout his career, he has exemplified professionalism, dedication, and a commitment to serving something greater than himself. Beyond his remarkable accomplishments, Jeremy has devoted countless hours to engaging with students and communities across the country, encouraging young Canadians to pursue careers in STEM and believe in what's possible. Recently, we had the privilege of welcoming Jeremy to Chedabucto Education Centre near Spaceport Nova Scotia. He shared the story of his journey to becoming an astronaut, the challenges, the perseverance, and the curiosity that helped shape his path. He also spoke about the importance of launching from Canada and the incredible opportunities a strong Canadian space sector can create for future generations. Thank you, Jeremy, for your extraordinary service to Canada, your leadership, and your unwavering commitment to inspiring future generations. Your legacy reaches far beyond the missions you fly- we wish you best on your next chapter! 🚀🇨🇦 👨🚀
