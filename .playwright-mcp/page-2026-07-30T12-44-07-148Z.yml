                      - text: Race To Alaska
                    - text: (R2AK), and we're proud to sponsor David Gauci and the Agile Racing team as they prepare to take on one of the most demanding small-boat races in the world.
                    - link [ref=f20e452] [cursor=pointer]:
                      - /url: https://www.linkedin.com/signup/cold-join?session_redirect=https%3A%2F%2Fwww.linkedin.com%2Ffeed%2Fhashtag%2Fr2ak&trk=organization_guest_main-feed-card-text
                      - text: "#R2AK"
                    - text: is a 750-mile race from Port Townsend, Washington, to Ketchikan, Alaska. No engines. No support crews. Just human and wind power, determination, and the ability to navigate some of the most challenging coastal waters in North America. David's 27-foot fiberglass racing sailboat is built for performance. At just 1,750 pounds, it's an exceptionally fast and efficient vessel, but in a race like R2AK, success depends on far more than speed. Preparation, teamwork, resilience, and sound decision-making will be tested every mile of the journey. As the team completes its final preparations, we want to congratulate David and his crew on the dedication and commitment they've shown in getting to the starting line. Taking on a challenge of this magnitude is an accomplishment in itself. Fair winds and following seas, David and team. We're excited to be part of your journey.
