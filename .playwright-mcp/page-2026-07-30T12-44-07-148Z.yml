                    - text: vessels out doing what they were built to do, whether responding to emergencies or quietly standing by so Canadians can safely enjoy days like this. CCGS Cape St. James is one of the 47’ Cape-class lifeboats our team at Ocean Pacific Marine has had the privilege of renewing through our Vessel Life Extension Program. Seeing these vessels continue serving communities across our coast is a reminder that the work of skilled marine trades extends well beyond the shipyard. We’re honoured to play a small part in helping keep Canadians safe on the water. From all of us at Ocean Pacific Marine, have a safe, happy, and memorable Canada Day! 🍁🌊
