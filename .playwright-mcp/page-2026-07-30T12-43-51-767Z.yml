          - heading [level=2] [ref=f13e69]: About us
          - generic [ref=f13e70]:
            - paragraph [ref=f13e71]: "Maritime Launch (Cboe CA: MAXQ, OTCQB: MAXQF) is a Canadian-owned commercial space company based in Nova Scotia. Maritime Launch is developing Spaceport Nova Scotia, a dual-use commercial spaceport designed to support both civil and defence-related space missions. The spaceport will provide satellite launch services to domestic and international clients across the global commercial space market, supporting a wide range of orbital inclinations from a single location. Spaceport Nova Scotia is Canada’s first commercial orbital launch complex, enabling launch vehicles to place satellites into low Earth orbit. For more information about Maritime Launch and Spaceport Nova Scotia, visit www.maritimelaunch.com"
